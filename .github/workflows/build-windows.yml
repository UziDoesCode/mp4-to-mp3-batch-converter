name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MP4-to-MP3-Converter --collect-all imageio_ffmpeg app.py
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MP4-to-MP3-Converter.exe
          generate_release_notes: true
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MP4-to-MP3-Converter-Windows
          path: dist/MP4-to-MP3-Converter.exe
